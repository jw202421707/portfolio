        school:
          name: "전북대학교"
        date: "2024년 3월 - 2028년 2월 졸업 예정"
        content: |-
          현재 3학년으로 재학 중입니다.

          프로그래밍, 알고리즘, 데이터베이스, 운영체제, 인공지능 등 컴퓨터공학의 기초와 전공 지식을 학습하고 있습니다. 전공 수업에서 배운 내용을 연구 활동과 개발 프로젝트에 적용하며 문제 해결 역량을 쌓고 있습니다.

  # Achievements
  achievements:
    enable: true
    title: "성과"
    items:
      - title: "제주 환경보전 해커톤 본선 진출"
        content: "2026년 10월, 서울대학교 빅데이터 융합 사업단이 주관한 제주 환경보전 해커톤 본선에 진출했습니다. 팀원과 함께 여행자의 일정·위치·관심사를 바탕으로 환경보전 활동을 추천하는 AI 기반 관광 서비스를 기획하고 개발했습니다."

  # projects
  projects:
    enable: true
    title: "프로젝트"
    items:
      - title: "제주도움 | AI 기반 제주 환경보전 관광 플랫폼"
        content: |-
          2026년 10월 · 본선 진출 · 완료

          서울대학교 빅데이터 융합 사업단이 주관한 제주 환경보전 해커톤에 참가하여, 여행자에게 맞춤형 환경보전 활동을 추천하는 플랫폼을 기획하고 개발했습니다.

          관광객이 여행 일정과 관심사에 맞는 환경보전 활동을 쉽게 발견하고 참여할 수 있도록 하여, 관광과 지역 환경보전을 자연스럽게 연결하는 것을 목표로 했습니다.

          서비스의 전체 구조와 핵심 기능을 설계하고, 실제 웹서비스 구현에 참여했습니다. 여행자의 일정·위치·관심사를 활용한 추천 흐름과 사용자 이용 과정을 구체화했습니다.

          해커톤 본선에 진출했으며, 아이디어를 서비스 구조와 웹 화면으로 구체화하는 경험을 쌓았습니다.
        badges:
          - "AI 추천"
          - "웹서비스"
          - "환경보전"

      - title: "웹툰 PSD 기반 영상 생성 AI Agent"
        content: |-
          2026년 7월 - 현재 · 진행 중

          웹툰 PSD 파일의 계층별 레이어 정보를 활용하여 영상 콘텐츠 생성 과정을 지원하는 AI Agent를 연구하고 개발하고 있습니다.

          인물과 배경 등이 분리된 PSD 레이어 정보를 활용해 영상 생성 과정에 필요한 이미지 처리를 자동화하고, 영상 생성 모델과 연결되는 시스템을 구현하는 것을 목표로 합니다.

          PSD 레이어 구조와 계층 정보를 분석하고, 인물 레이어 추출 및 이미지 처리 기술을 탐구하고 있습니다. 또한 영상 생성 모델과 연결하는 시스템 구조와 AI Agent를 활용한 콘텐츠 생성 과정을 연구하고 있습니다.
        badges:
          - "AI Agent"
          - "컴퓨터 비전"
          - "영상 생성"

