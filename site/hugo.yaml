  # About
  about:
    enable: true
    title: "소개"
    image: "/images/jiwoo-avatar.png"
    imageAlt: "이지우 소개 아바타"
    content: |-
      저는 컴퓨터인공지능학부에 재학 중인 이지우입니다. 인공지능이 이미지와 영상 정보를 이해하고 새로운 결과를 만들어 내는 과정, 그리고 그 기술을 실제 문제 해결에 적용할 수 있다는 점에 관심을 가지고 있습니다.

      MACS LAB의 학부 연구 활동을 통해 논문을 읽으며 모델의 구조와 연구 목적을 공부하고 있습니다. 또한 해커톤과 개발 프로젝트에 참여하며 학습한 기술을 실제 결과물로 구현하는 경험을 쌓고 있습니다.

      앞으로는 컴퓨터 비전과 생성형 AI 모델의 구조를 더 깊이 이해하고, 논문 구현과 실험 결과 비교를 꾸준히 진행하는 것이 목표입니다. 이를 위해 관련 논문을 정기적으로 정리하고, 웹툰 PSD 기반 영상 생성 프로젝트에서 모델 연동과 성능 개선을 직접 검증할 계획입니다.
    skills:
      enable: true
      title: "현재 학습하고 활용하는 기술입니다."
      items:
        - "Python"
        - "C++"
        - "HTML · CSS · JavaScript"
        - "Git · GitHub"
        - "인공지능 · 컴퓨터 비전"

  # Experience
  experience:
    enable: true
    title: "연구 및 활동"
    items:
      - company: "MACS LAB"
        jobs:
          - name: "학부연구생"
            date: "2026년 7월 - 현재"
            info:
              content: "인공지능 · 컴퓨터 비전"
            content: |-
              이미지 및 영상 생성 인공지능 분야의 논문을 읽고 모델의 구조와 연구 목적을 학습하고 있습니다. VAE의 잠재공간을 활용한 이미지 생성 원리, CLIP의 이미지와 텍스트 간 관계 학습 방식, DynamiCrafter의 단일 이미지 기반 영상 생성 방법 등을 공부했습니다.

              주요 학습 내용
              - 논문에서 해결하려는 문제와 기존 방법의 한계 파악
              - 모델 구조와 핵심 동작 원리 정리
              - 제안 방법과 기존 연구의 차이 비교
              - 이해가 부족한 부분을 반복해서 읽고 학습 내용 기록

  # Education
  education:
    enable: true
    title: "학력"
    index: false
    items:
